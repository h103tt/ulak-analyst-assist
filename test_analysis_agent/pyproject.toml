[project]
name = "test-analysis-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chardet==5.2.0",
    "deepagents>=0.7.4",
    "fastapi>=0.141.1",
    "httpx",
    "langchain>=1.3.14",
    "langchain-chroma",
    "langchain-classic",
    "langchain-community",
    "langchain-core",
    "langchain-google-genai",
    "langchain-text-splitters",
    "langgraph",
    "openpyxl",
    "pandas",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.10",
    "pydantic",
    "python-docx",
    "python-dotenv",
    "pytesseract>=0.3.13",
    "unstructured>=0.25.2",
    "uvicorn",
    "langchain-docling[local]>=3.0.0",
    "sentence-transformers>=6.0.0",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "deepeval>=1.0.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires a working Gemini API key (and usually an ingested knowledge base)",
    "e2e: end-to-end RAG regression suite under tests/e2e",
]
asyncio_mode = "auto"
